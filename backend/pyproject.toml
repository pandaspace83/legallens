[project]
name = "legallens"
version = "0.1.0"
description = "LegalLens backend: FastAPI API, ingestion worker and hybrid search over SQLite"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "docling>=2.134.0",
    "extract-msg>=0.56.1",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "numpy>=1.26",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pyotp>=2.10.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-ulid>=4.0.1",
    "sentence-transformers>=3.0",
    "sqlalchemy>=2",
    "sqlcipher3>=0.6.4",
    "sqlite-vec>=0.1.9",
    "sse-starlette>=3.5.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.uv]
# LegalLens runs on an Apple-silicon Mac or a Linux/Windows PC with an NVIDIA GPU (TA, "Model selection and
# hardware"). PyTorch, needed by Docling, has no wheels for Intel Macs, so they are excluded from the lockfile.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]

[project.scripts]
legallens = "legallens.cli:app"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "SIM905", "UP047", "RUF012"]

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Belt and braces: on macOS, Python 3.13 skips .pth files carrying the "hidden" flag, which can break the
# editable install. Putting src on the path keeps the tests independent of that.
pythonpath = ["src"]
addopts = "-q -m 'not slow and not llm'"
markers = [
    "slow: Docling, OCR and ClamAV tests (run with: pytest -m slow)",
    "llm: real calls to the local Ollama models (run with: pytest -m llm)",
]
filterwarnings = ["ignore::DeprecationWarning"]
